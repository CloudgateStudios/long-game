name: Update Release Branch

# Ships what is on main: runs the release checks, then moves the release branch to main.
# Xcode Cloud builds every change to release and sends it to TestFlight.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  update:
    name: Update release branch
    if: github.ref == 'refs/heads/main'
    # macOS for cktool, which the CloudKit schema check uses.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Write Local.xcconfig
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          LG_ICLOUD_CONTAINER: ${{ secrets.LG_ICLOUD_CONTAINER }}
        run: |
          printf 'DEVELOPMENT_TEAM = %s\nLG_ICLOUD_CONTAINER = %s\n' \
            "$DEVELOPMENT_TEAM" "$LG_ICLOUD_CONTAINER" > Config/Local.xcconfig
      - name: Check and update release
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
        run: sh Scripts/update_release.sh

  tag:
    name: Tag and release a new version
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the version and create a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9]*\.[0-9]*\.[0-9]*\)" *$/\1/p' project.yml)"
          [ -n "$version" ] || { echo "error: no MARKETING_VERSION like \"1.2.3\" in project.yml." >&2; exit 1; }
          # A release without a version bump ships under a version that already has its tag.
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged. Nothing to do."
            exit 0
          fi
          # Creates the tag on the commit release now points at, along with the release.
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
