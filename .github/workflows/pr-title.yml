name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Semantic title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks the title against Conventional Commits (feat:, fix:, chore(deps): ...).
      # With squash merging, the title becomes the commit subject on main.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
