name: Release

# Ships what is on main to TestFlight: runs Scripts/release.sh, which raises the version
# through a pull request and then moves the release branch for Xcode Cloud to build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    # macOS for cktool, which the CloudKit schema check uses.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      # RELEASE_TOKEN, not the built-in token: a pull request opened with the built-in
      # token does not start the checks it needs to merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Write Local.xcconfig
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          LG_ICLOUD_CONTAINER: ${{ secrets.LG_ICLOUD_CONTAINER }}
        run: |
          printf 'DEVELOPMENT_TEAM = %s\nLG_ICLOUD_CONTAINER = %s\n' \
            "$DEVELOPMENT_TEAM" "$LG_ICLOUD_CONTAINER" > Config/Local.xcconfig
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh Scripts/release.sh "$BUMP"
